<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add LDAP Statement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .console { background:#1e1e1e; color:#4af626; font-family:monospace; border-radius:5px; border:1px solid #333; }
        .console-header { border-bottom:1px solid #333; padding:5px 10px; color:#888; background:#252526; }
        .console-body { padding:15px; max-height:400px; overflow-y:auto; }
        .console-error { color:#ff5555; }
        .console-line::before { content: "> "; color:#888; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h1 class="h3 mb-0"><i class="bi bi-diagram-3 me-2 text-primary"></i>Add/Edit LDAP Statement</h1>
                </div>
                <div class="card-body p-4">
                    <form id="ldapForm" th:action="@{/admin/ldap/save}" th:object="${statement}" method="post">
                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                        <input type="hidden" th:field="*{id}"/>
                        <input type="hidden" th:field="*{environment}"/>
                        <input type="hidden" id="paramNamesInput" th:field="*{paramNames}"/>

                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Name (Endpoint Identifier)</label>
                            <input id="name" class="form-control" th:field="*{name}" required placeholder="e.g., find_scientist"/>
                            <div class="form-text">Used in URL: <code>/api/ldap/query/{env}/{name}</code></div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Description</label>
                            <textarea id="description" class="form-control" th:field="*{description}" rows="2"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="dbConnection" class="form-label fw-bold">LDAP Connection</label>
                            <select id="dbConnection" class="form-select" th:field="*{dbConnection}" required>
                                <option value="" disabled selected>-- Select LDAP Connection --</option>
                                <option th:each="conn : ${connections}" th:value="${conn.id}" th:text="${conn.name} + ' (' + ${conn.environment} + ')' "></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="baseDn" class="form-label fw-bold">Base DN</label>
                            <input id="baseDn" class="form-control" th:field="*{baseDn}" required placeholder="dc=example,dc=com"/>
                        </div>

                        <div class="mb-3">
                            <label for="attributes" class="form-label fw-bold">Attributes (comma separated)</label>
                            <input id="attributes" class="form-control" th:field="*{attributes}" placeholder="cn,mail,uid"/>
                        </div>

                        <div class="mb-3">
                            <label for="filterContent" class="form-label fw-bold">LDAP Filter</label>
                            <textarea id="filterContent" class="form-control" th:field="*{filterContent}" rows="4" required placeholder="(uid={0})"></textarea>
                            <div class="form-text">Use placeholders like <code>{0}</code>, <code>{1}</code> for parameters.</div>
                        </div>

                        <div id="paramsContainer" class="mb-3 p-3 bg-light rounded border" style="display:none;">
                            <h6 class="fw-bold mb-3"><i class="bi bi-sliders me-2"></i>Filter Parameters</h6>
                            <div id="paramsList"></div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="/admin/ldap" class="btn btn-outline-secondary">Cancel</a>
                            <div>
                                <button type="button" class="btn btn-info text-white me-2" onclick="testLdap()">
                                    <i class="bi bi-play-fill me-1"></i> Test LDAP
                                </button>
                                <button type="submit" class="btn btn-primary" id="saveBtn" disabled>
                                    <i class="bi bi-save me-1"></i> Save Statement
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div id="console" class="console mt-4" style="display:none;">
                <div class="console-header"><i class="bi bi-terminal me-2"></i>Output Console</div>
                <div id="consoleOutput" class="console-body"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const filterInput = document.getElementById('filterContent');
        const paramsContainer = document.getElementById('paramsContainer');
        const paramsList = document.getElementById('paramsList');
        const paramNamesInput = document.getElementById('paramNamesInput');
        const saveBtn = document.getElementById('saveBtn');

        document.getElementById('name').addEventListener('blur', function() {
            this.value = this.value.toLowerCase();
        });

        window.updateHiddenParamNames = function() {
            const names = Array.from(document.querySelectorAll('.param-name-input'))
                .map(x => x.value.trim())
                .filter(x => x.length > 0);
            paramNamesInput.value = names.join(',');
            saveBtn.disabled = true;
        };

        function updateParamsUI() {
            const filter = filterInput.value || '';
            const regex = /\{(\d+)\}/g;
            const found = [...filter.matchAll(regex)].map(m => parseInt(m[1], 10));
            if (found.length === 0) {
                paramsContainer.style.display = 'none';
                paramsList.innerHTML = '';
                updateHiddenParamNames();
                return;
            }

            const maxPos = Math.max(...found);
            const saved = (paramNamesInput.value || '').split(',').map(x => x.trim()).filter(x => x);
            paramsContainer.style.display = 'block';

            let html = '';
            for (let i = 0; i <= maxPos; i++) {
                const defaultName = saved[i] || `arg${i + 1}`;
                html += `
                    <div class="row mb-2 align-items-center">
                        <div class="col-auto"><span class="badge bg-secondary">{${i}}</span></div>
                        <div class="col">
                            <input class="form-control form-control-sm param-name-input" value="${defaultName}" placeholder="Query Param Name" oninput="updateHiddenParamNames()"/>
                        </div>
                        <div class="col">
                            <input class="form-control form-control-sm param-test-input" data-key="${i}" placeholder="Test Value"/>
                        </div>
                    </div>
                `;
            }
            paramsList.innerHTML = html;
            updateHiddenParamNames();
        }

        filterInput.addEventListener('input', updateParamsUI);
        document.getElementById('dbConnection').addEventListener('change', () => saveBtn.disabled = true);
        document.getElementById('baseDn').addEventListener('input', () => saveBtn.disabled = true);
        document.getElementById('attributes').addEventListener('input', () => saveBtn.disabled = true);
        updateParamsUI();
    });

    async function testLdap() {
        const consoleDiv = document.getElementById('console');
        const outputDiv = document.getElementById('consoleOutput');
        const saveBtn = document.getElementById('saveBtn');

        const connectionId = document.getElementById('dbConnection').value;
        const baseDn = document.getElementById('baseDn').value;
        const filter = document.getElementById('filterContent').value;
        const attributes = document.getElementById('attributes').value;

        if (!connectionId || !baseDn || !filter) {
            alert('Please provide connection, base DN and filter.');
            return;
        }

        const paramNames = (document.getElementById('paramNamesInput').value || '')
            .split(',')
            .map(x => x.trim())
            .filter(x => x);

        const paramValues = {};
        const testInputs = document.querySelectorAll('.param-test-input');
        testInputs.forEach(input => {
            const idx = parseInt(input.dataset.key, 10);
            const name = paramNames[idx];
            if (name) {
                paramValues[name] = input.value;
            }
        });

        const payload = { connectionId, baseDn, filter, attributes, paramNames, paramValues };

        consoleDiv.style.display = 'block';
        outputDiv.innerHTML = '<div class="console-line">Initiating LDAP query...</div>';

        try {
            const response = await fetch('/admin/ldap/test-ajax', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (result.status === 'success') {
                outputDiv.insertAdjacentHTML('beforeend', '<div class="console-line" style="color:#4af626;">Execution successful.</div>');
                outputDiv.insertAdjacentHTML('beforeend', `<pre class="console-line" style="color:#ddd; margin:0; white-space:pre-wrap;">${JSON.stringify(result.data, null, 2)}</pre>`);
                saveBtn.disabled = false;
            } else {
                outputDiv.insertAdjacentHTML('beforeend', `<div class="console-line console-error">${result.message || 'LDAP query failed.'}</div>`);
                if (result.stacktrace) {
                    outputDiv.insertAdjacentHTML('beforeend', `<pre class="console-line console-error" style="white-space:pre-wrap;">${result.stacktrace}</pre>`);
                }
                saveBtn.disabled = true;
            }
        } catch (error) {
            outputDiv.insertAdjacentHTML('beforeend', `<div class="console-line console-error">Error: ${error.message}</div>`);
            saveBtn.disabled = true;
        }
    }
</script>
</body>
</html>
